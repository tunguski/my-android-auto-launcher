name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job needs to write, and it says so
# itself, so a pull request from a fork cannot do anything but build and test.
permissions:
  contents: read

jobs:
  check:
    name: Format, unit tests, debug APK, user guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # A public repository takes pull requests, and a tampered wrapper jar is
      # the classic way to get code to run in CI. This is the official check.
      - uses: gradle/actions/wrapper-validation@v4

      - name: Check the formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # assembleDebug also renders the user guide as PDF and HTML.
      - name: Assemble debug APK and the user guide
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: navi-debug-apk
          path: app/build/outputs/apk/debug/navi-*-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: navi-user-guide
          path: |
            docs/USER_GUIDE.md
            docs/navi-user-guide.pdf
            docs/navi-user-guide.html
            docs/previews
          if-no-files-found: error

  instrumented:
    name: On-device tests and previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 1280x720 landscape: the resolution of the head unit this is built for.
      - name: Run the journey tests and refresh the previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -skin 1280x720
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            bash tools/screenshots.sh
            ./gradlew --no-daemon userGuide

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn

      # The previews and the guide produced on the emulator, as built here.
      - uses: actions/upload-artifact@v4
        with:
          name: navi-previews
          path: |
            docs/previews
            docs/navi-user-guide.pdf
            docs/navi-user-guide.html
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, instrumented]
    runs-on: ubuntu-latest
    # The only job that writes anything, and only on a tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The previews taken on the emulator in the job above go into the release,
      # so the published guide shows the build being released.
      - uses: actions/download-artifact@v4
        with:
          name: navi-previews
          path: docs

      # The keystore lives only in repository secrets, base64-encoded:
      #   base64 -w0 release.jks  ->  secret NAVI_KEYSTORE_BASE64
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NAVI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing NAVI_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK and the user guide
        env:
          NAVI_KEYSTORE: ${{ runner.temp }}/release.jks
          NAVI_KEYSTORE_PASSWORD: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
          NAVI_KEY_ALIAS: ${{ secrets.NAVI_KEY_ALIAS }}
          NAVI_KEY_PASSWORD: ${{ secrets.NAVI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect what the release carries
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/navi-*-release.apk release/
          cp docs/navi-user-guide.pdf release/
          cp docs/navi-user-guide.html release/
          cp docs/USER_GUIDE.md release/
          (cd docs && zip -r "$GITHUB_WORKSPACE/release/navi-previews.zip" previews)
          sha256sum release/* > SHA256SUMS.txt
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
