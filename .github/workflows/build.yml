name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job needs to write, and it says so
# itself, so a pull request from a fork cannot do anything but build and test.
permissions:
  contents: read

jobs:
  check:
    name: Format, unit tests, debug APK, user guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # A public repository takes pull requests, and a tampered wrapper jar is
      # the classic way to get code to run in CI. This is the official check.
      - uses: gradle/actions/wrapper-validation@v4

      - name: Check the formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # assembleDebug also renders the user guide as PDF and HTML.
      - name: Assemble debug APK and the user guide
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: navi-debug-apk
          path: app/build/outputs/apk/debug/navi-*-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: navi-user-guide
          path: |
            docs/USER_GUIDE.md
            docs/navi-user-guide.pdf
            docs/navi-user-guide.html
            docs/previews
          if-no-files-found: error

  instrumented:
    name: On-device tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Four emulators, a quarter of the tests each. The suite cannot be split
      # inside one device: the tests share the recorder's static state, one
      # database and the HOME role, so the only safe division is one device per
      # shard. Booting an emulator costs about two and a half minutes whatever
      # it then runs, so four shards is where the gain flattens out.
      #
      # Which classes each number means is in tools/shard.sh and nowhere else.
      # It used to be written out here as well, which meant the list existed
      # twice and tools/ci-local.sh - the script whose whole purpose is to run
      # what CI runs - had to be told it a third time. A number is also the one
      # thing that survives being handed to two shells in a row, which is what
      # the action does with the script line below.
      #
      # fail-fast off on purpose: a failing shard must not cancel the others,
      # or the run throws away the three reports that say what still works.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 1280x720 landscape: the resolution of the head unit this is built for.
      - name: Run this shard of the journey tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -skin 1280x720
          disable-animations: true
          # A path and a digit on purpose: this string is wrapped and handed to
          # a shell by the action, so anything clever in it - a dollar sign
          # above all - is at the mercy of two levels of expansion. The work,
          # the shard division, the annotations naming what failed and the
          # device log all live in tools/shard.sh, which can be read and run.
          script: sh tools/shard.sh ${{ matrix.shard }}

      # One name per shard, or the four uploads would fight over one artifact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/connected
            device-log
          if-no-files-found: warn

  # Separate from the shards, because the previews are not a quarter of
  # anything: screenshots.sh runs ScreenshotTest itself and collects all of the
  # pictures, so it has to see one whole device. Sharding it would have meant
  # guessing which shard the class landed in, which the runner decides by hash.
  previews:
    name: Previews and user guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Refresh the previews and render the guide
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -skin 1280x720
          disable-animations: true
          script: |
            bash tools/screenshots.sh
            ./gradlew --no-daemon userGuide

      # The previews and the guide produced on the emulator, as built here.
      - uses: actions/upload-artifact@v4
        with:
          name: navi-previews
          path: |
            docs/previews
            docs/navi-user-guide.pdf
            docs/navi-user-guide.html
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, instrumented, previews]
    runs-on: ubuntu-latest
    # The only job that writes anything, and only on a tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # "packages" is pinned because the action default still asks for the
      # obsolete "tools" package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The previews taken on the emulator in the job above go into the release,
      # so the published guide shows the build being released.
      - uses: actions/download-artifact@v4
        with:
          name: navi-previews
          path: docs

      # The keystore lives only in repository secrets, base64-encoded:
      #   base64 -w0 release.jks  ->  secret NAVI_KEYSTORE_BASE64
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NAVI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing NAVI_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK and the user guide
        env:
          NAVI_KEYSTORE: ${{ runner.temp }}/release.jks
          NAVI_KEYSTORE_PASSWORD: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
          NAVI_KEY_ALIAS: ${{ secrets.NAVI_KEY_ALIAS }}
          NAVI_KEY_PASSWORD: ${{ secrets.NAVI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect what the release carries
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/navi-*-release.apk release/
          cp docs/navi-user-guide.pdf release/
          cp docs/navi-user-guide.html release/
          cp docs/USER_GUIDE.md release/
          (cd docs && zip -r "$GITHUB_WORKSPACE/release/navi-previews.zip" previews)
          sha256sum release/* > SHA256SUMS.txt
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
